# Database type; options include SQLITE, MYSQL, and POSTGRESQL.
# Note: We do not automatically migrate your data when switching database types. :)
# Note: When using MySQL across multiple servers, be sure to set `allow-open-when-owner-offline` to `false` in `config.yml`
#       to prevent players from exploiting item duplication by opening the same backpack on different servers.
storageType: SQLITE

# 使用Base64编码数据字段
base64EncodeVal: true
#########################################################################

#########################################################################
# Number of database read/write threads
# When using MySQL, it is recommended that the maximum number of connections equals the sum of read and write threads, with the number of read threads exceeding the number of write threads.
# Note: More threads are not necessarily better; an excessive number can actually lead to performance degradation. Please allocate an appropriate number.

# Number of read threads
readExecutorThread: 7
# Number of write threads
writeExecutorThread: 3
#########################################################################

#########################################################################
# Sqlite Configuration
sqlite:
  maxConnection: 5
#########################################################################

#########################################################################
# MySQL Configuration
mysql:
  # Database connection address
  host: "127.0.0.1"
  # Database connection port
  port: 3306
  # Database name     
  database: ""
  # Table prefix
  tablePrefix: ""
  # Connection username
  user: ""
  # Connection user password
  password: ""
  # Whether to use encrypted connection
  useSSL: false
  # Maximum connection count
  maxConnection: 10
#########################################################################

#########################################################################
# PostgreSQL Configuration
postgresql:
  # Database connection address
  host: "127.0.0.1"
  # Database connection port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Connection username
  user: ""
  # Connection user password
  password: ""
  # Whether to use encrypted connection
  useSSL: false
  # Maximum connection count
  maxConnection: 10
#########################################################################