#########################################################################
# Database type; options include SQLITE, MYSQL, and POSTGRESQL
# Note: We do not automatically migrate your data when switching database types :)
storageType: SQLITE

# Use Base64 to encode data fields
base64EncodeVal: true

# Chunk data loading mode
# Available options:
# - LOAD_WITH_CHUNK: Loads Slimefun chunk data when a chunk is loaded for the first time during the current server session.
# - LOAD_ON_STARTUP: Loads all chunk data at once upon server startup, which may result in longer startup times.
# LOAD_WITH_CHUNK is recommended by default to save unnecessary memory overhead.
# If you experience noticeable lag when chunks are loaded, please change this to LOAD_ON_STARTUP.
dataLoadMode: LOAD_WITH_CHUNK
#########################################################################

#########################################################################
# Database read and write thread count
# When using MySQL, it is recommended to set maxConnections equal to (readExecutorThread + writeExecutorThread), 
# and the read thread count should be greater than the write thread count.
# Note: More threads do not necessarily mean better performance; too many threads can cause performance degradation. Please allocate an appropriate number.

# Read thread count
readExecutorThread: 10
# Write thread count
writeExecutorThread: 5
#########################################################################

#########################################################################
# Delayed writing feature
# This feature prevents frequent data writes from cluttering the queue with redundant write requests.
# When enabled, after data is modified, it will wait for (delayedSecond) seconds; if no further changes occur, it will write to the database.
# Forcing a save will push all pending data directly into the write queue.
delayedWriting:
  # Enable delayed writing
  enable: true
  # Delay time in seconds
  delayedSecond: 5
  # Forced save interval (in seconds)
  forceSavePeriod: 300
#########################################################################

#########################################################################
# SQLite Configuration
sqlite:
  maxConnection: 5
#########################################################################

#########################################################################
# MySQL Configuration
mysql:
  # Database host address
  host: "127.0.0.1"
  # Database port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Database username
  user: ""
  # Database password
  password: ""
  # Enable SSL connection
  useSSL: false
  # Maximum connections
  maxConnection: 15
#########################################################################

#########################################################################
# PostgreSQL Configuration
postgresql:
  # Database host address
  host: "127.0.0.1"
  # Database port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Database username
  user: ""
  # Database password
  password: ""
  # Enable SSL connection
  useSSL: false
  # Maximum connections
  maxConnection: 15
#########################################################################