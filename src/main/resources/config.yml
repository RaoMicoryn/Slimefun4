# options:
#    auto-update - Automatically check for and update to new GitHub releases
#    armor-update-interval - Update interval for Slimefun armor effects
#    enable-armor-effects - Toggle for armor effects
#    chat-prefix - Prefix for all Slimefun messages
#    auto-save-delay-in-minutes - Interval for automatic data saving (in minutes)
#    legacy-ore-washer - Whether to use the legacy Ore Washer mechanism
#    legacy-dust-washer - Whether to use the legacy Dust Washer mechanism
#    legacy-ore-grinder - Whether to use the legacy Ore Grinder mechanism
#    language - Language for Slimefun text (excluding items)
#    enable-translations - Multi-language support
#    backwards-compatibility - Legacy item compatibility mode; disabling this switches to the new item system
#                             and improves performance
#    log-duplicate-block-entries - Whether to log warnings when duplicate blocks are found
#    burn-players-when-radioactive - Whether to burn players exposed to radiation
#    drop-excess-sf-give-items - Whether to drop excess items on the ground when the inventory is full during /sf give
#    backup-data - Automatically back up data
#    bypass-environment-check - Skip compatibility checks (Note: Bug reports will not be accepted if enabled)
options:
  auto-update: true
  chat-prefix: '&a&lSlimefun 4 &7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: en
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  bypass-environment-check: false
  bypass-item-length-check: false
  max-gps-waypoints: 21

guide:
  # Whether to display original item crafting recipes in the guide.
  show-vanilla-recipes: true
  # Whether to give the guide to players on their first join
  receive-on-first-join: true
  # Whether to show hidden item groups in the search
  show-hidden-item-groups-in-search: false

researches:
  # Whether to allow creative mode players to unlock researches for free
  free-in-creative-mode: true
  # Whether to play fireworks when unlocking researches
  enable-fireworks: true
  # Whether to use currency instead of experience to unlock researches
  use-money-unlock: false
  # The rate at which experience is converted to currency
  currency-cost-convert-rate: 25.0
  # Disable the animation when unlocking research?
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

talismans:
  use-actionbar: true

metrics:
  auto-update: false

backpack:
  # Whether the backpack can be opened while the owner is offline.
  allow-open-when-owner-offline: true

research-ranks:
- Chick
- Mr. Ox
- Spider
- Villager
- Pioneer
- Pupil
- Intern
