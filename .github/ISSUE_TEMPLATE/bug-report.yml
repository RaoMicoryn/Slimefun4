name: Bug Report
description: Report issues and bugs encountered while using Slimefun 4
labels:
  - "🐞 Bug"

body:
  - type: markdown
    attributes:
      value: |
        Thank you for using the Slimefun issue feedback system!

        Before reporting, please verify that:
        - You have checked the [Latest Release](https://github.com/SlimefunGuguProject/Slimefun4/releases) to see if your issue has already been fixed.
        - You have searched existing [Issues](https://github.com/SlimefunGuguProject/Slimefun4/issues) to check for similar reports.

        If your report is vague or does not follow the template, it will be closed directly.

  - type: textarea
    id: issue-description
    attributes:
      label: Problem Description
      description: Describe the issue you encountered in detail here
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility Rate
      description: Select the frequency of the issue occurring
      options:
        - Unable to reproduce
        - Low occurrence
        - High occurrence
        - Always occurs
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Briefly describe how we can reproduce this issue
      placeholder: |
        Briefly describe how to reproduce this issue.
        You may use a numbered list format (1. 2. 3.) or any other appropriate structure.
        If the issue is hard to reproduce, please describe the context when it happened as accurately as possible.
    validations:
      required: true

  - type: dropdown
    id: server-platform-type
    attributes:
      label: Server Platform Type
      description: |
        Select the server core you are using, such as `Paper`.
        Note: The localized repository does not offer support for **hybrid servers** (e.g., Arclight, CatServer, or other cores supporting both plugins and mods). Please resolve those independently.
      options:
        - Paper
        - Leaves
        - Purpur
        - Airplane
        - Pufferfish
        - Leaf
        - Mirai
        - Other server types (Please specify in "Problem Description")
    validations:
      required: true

  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft Version
      options:
        - 26.2.x
        - 26.1.x
        - 1.21.9~1.21.10
        - 1.21.7~1.21.8
        - 1.21.6
        - 1.21.5
        - 1.21.4
        - 1.21.2~1.21.3
        - 1.21~1.21.1
        - 1.20.x
        - 1.19.x
        - 1.18.x
        - 1.17.x
        - 1.16.x
        - 1.15.x
        - 1.14.x
    validations:
      required: true

  - type: textarea
    id: slimefun-version
    validations:
      required: true
    attributes:
      label: Slimefun Version
      description: |
        **Do not fill in "latest version", otherwise your feedback will be closed immediately.**
        Please provide a screenshot or copy the output of the `/sf versions` command.
      placeholder: Slimefun 2025.1

  - type: textarea
    id: other-plugin
    attributes:
      label: Server Plugin List
      description: Provide your server's plugin list, which can be retrieved using the `/plugins` command.
      placeholder: |
        Plugin: Version

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other relevant context or details here if necessary.